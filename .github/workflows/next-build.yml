name: SIGES Next.js build gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit --pretty false 2>&1 | tee /tmp/siges-tsc.log; exit ${PIPESTATUS[0]}

      - name: Upload TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: siges-tsc-diagnostics
          path: /tmp/siges-tsc.log
          retention-days: 1

      - name: Fail on TypeScript errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Production build
        run: npm run build
