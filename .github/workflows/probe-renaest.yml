name: Probe RENAEST structure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Descobrir último recurso RENAEST 2026
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, re
          u='https://dados.transportes.gov.br/api/3/action/package_show?id=renaest'
          pkg=json.load(urllib.request.urlopen(u, timeout=60))['result']
          rs=[r for r in pkg['resources'] if re.search(r'RENAEST\s*-?\s*Mensal\s*-?\s*04-2026', r.get('name',''), re.I)]
          if not rs:
              raise SystemExit('Recurso 04-2026 não encontrado')
          r=rs[0]
          print('NAME=',r['name'])
          print('ID=',r['id'])
          print('URL=',r['url'])
          print('SIZE=',r.get('size'))
          open('/tmp/renaest-url','w').write(r['url'])
          PY
      - name: Baixar RENAEST 04-2026 em blocos paralelos
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat /tmp/renaest-url)"
          total="$(python - <<'PY'
          import json, urllib.request
          pkg=json.load(urllib.request.urlopen('https://dados.transportes.gov.br/api/3/action/package_show?id=renaest', timeout=60))['result']
          r=next(r for r in pkg['resources'] if r.get('id')=='ff1cfdec-1f90-46c5-a900-fc5943c99792')
          print(r['size'])
          PY
          )"
          chunk=$((20*1024*1024))
          mkdir -p /tmp/renaest-parts
          export url total chunk
          python - <<'PY' > /tmp/renaest-ranges
          import os
          total=int(os.environ['total']); chunk=int(os.environ['chunk'])
          for i,start in enumerate(range(0,total,chunk)):
              end=min(total-1,start+chunk-1)
              print(i,start,end,end-start+1)
          PY
          cat /tmp/renaest-ranges | xargs -n4 -P8 bash -c '
            i="$0"; start="$1"; end="$2"; expected="$3"
            echo "Baixando parte $i: $start-$end"
            curl -L --fail --retry 5 --retry-delay 2 -H "Range: bytes=$start-$end" -o "/tmp/renaest-parts/$i.part" "$url"
            got=$(stat -c%s "/tmp/renaest-parts/$i.part")
            test "$got" -eq "$expected"
          '
          : > /tmp/renaest.zip
          while read -r i start end expected; do cat "/tmp/renaest-parts/$i.part" >> /tmp/renaest.zip; done < /tmp/renaest-ranges
          test "$(stat -c%s /tmp/renaest.zip)" -eq "$total"
          stat -c "%s bytes" /tmp/renaest.zip
      - name: Inspecionar ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -l /tmp/renaest.zip | head -80
          mkdir -p /tmp/renaest
          unzip -q /tmp/renaest.zip -d /tmp/renaest
          echo '--- ARQUIVOS ---'
          find /tmp/renaest -type f -maxdepth 3 -print
          echo '--- CABEÇALHOS ---'
          while IFS= read -r f; do
            echo "### $f"
            file "$f" || true
            head -n 5 "$f" | cut -c1-1500 || true
          done < <(find /tmp/renaest -type f)
