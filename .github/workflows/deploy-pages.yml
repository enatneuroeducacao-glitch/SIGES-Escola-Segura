name: SIGES frontend validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate official public sources snapshot
        working-directory: .
        run: node scripts/build-public-sources.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build SIGES
        run: npm run build

      - name: Validate SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Build validation complete
        run: echo "SIGES frontend validated successfully. Production deployment is handled by Render."
