name: Validate SIGES public sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/server.js"
      - "frontend/src/siges-main.jsx"
      - "frontend/src/PublicSources.jsx"
      - "scripts/enable-public-sources.js"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate public-source integration without modifying the repository
        run: |
          node <<'NODE'
          const fs = require('fs');
          const checks = [
            ['backend/server.js', 'public-sources'],
            ['frontend/src/siges-main.jsx', 'PublicSources'],
          ];
          const failures = [];
          for (const [file, token] of checks) {
            const text = fs.readFileSync(file, 'utf8');
            if (!text.includes(token)) failures.push(`${file}: missing ${token}`);
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('Public-source integration validated; no files modified.');
          NODE
